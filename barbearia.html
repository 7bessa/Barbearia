function vBarb(){return`<div class="top"><h2>Barbeiros</h2><button class="btn" onclick="openM({t:'barb'})">+ Novo barbeiro</button></div><div class="card tw"><table><tr><th>Nome</th><th>Comissão</th><th>Status</th><th></th></tr>${S.barbeiros.map(b=>`<tr><td><span class="ph s">${pic(b.id)}</span>${esc(b.nome)}</td><td>${b.comissao??40}%</td><td>${b.ativo?'<span class="tag ok">ativo</span>':'<span class="tag">inativo</span>'}</td><td class="row"><button class="btn s sm" onclick="openM({t:'barb',id:${b.id}})">Editar</button><button class="btn d sm" onclick="openM({t:'conf',msg:${js('Excluir '+b.nome+'?')},fn:()=>{S.barbeiros=S.barbeiros.filter(x=>x.id!=${b.id});save();closeM()}})">Excluir</button></td></tr>`).join('')}</table></div>`}
function vServ(){return`<div class="top"><h2>Serviços</h2><button class="btn" onclick="openM({t:'serv'})">+ Novo serviço</button></div><div class="card tw"><table><tr><th>Nome</th><th>Preço</th><th>Duração</th><th></th></tr>${S.servicos.map(s=>`<tr><td>${esc(s.nome)}</td><td>${brl(s.preco)}</td><td>${s.dur} min</td><td class="row"><button class="btn s sm" onclick="openM({t:'serv',id:${s.id}})">Editar</button><button class="btn d sm" onclick="openM({t:'conf',msg:${js('Excluir '+s.nome+'?')},fn:()=>{S.servicos=S.servicos.filter(x=>x.id!=${s.id});save();closeM()}})">Excluir</button></td></tr>`).join('')}</table></div>`}
function vAgend(){const l=S.agendamentos.filter(a=>(!filt.d||a.data==filt.d)&&(!filt.b||a.barberId==filt.b)&&(!filt.s||(filt.s=='pend'?a.status=='agendado'&&due(a):a.status==filt.s))).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
return`<h2>Todos os agendamentos</h2><div class="row" style="margin-bottom:14px"><input type="date" value="${filt.d}" onchange="filt.d=this.value;render()" style="width:180px"><select onchange="filt.b=this.value;render()" style="width:180px"><option value="">Todos barbeiros</option>${S.barbeiros.map(b=>`<option value="${b.id}" ${filt.b==b.id?'selected':''}>${esc(b.nome)}</option>`).join('')}</select><select onchange="filt.s=this.value;render()" style="width:190px"><option value="">Todos os status</option>${[['pend','Aguardando baixa'],['agendado','Agendado'],['concluido','Realizado'],['faltou','Não compareceu'],['cancelado','Cancelado']].map(([v,l])=>`<option value="${v}" ${filt.s==v?'selected':''}>${l}</option>`).join('')}</select><button class="btn s sm" onclick="filt={d:'',b:'',s:''};render()">Limpar</button></div><div class="card tw"><table><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Telefone</th><th>Barbeiro</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Ação</th></tr>${l.map(a=>`<tr><td>${fd(a.data)}</td><td>${a.hora}</td><td>${esc(a.clienteNome)}</td><td>${esc(a.clienteTel||'—')}</td><td>${bn(a.barberId)}</td><td>${esc(nm(S.servicos,a.servicoId)?.nome||'—')}</td><td>${brl(a.preco)}</td><td>${tag(a.status)}</td><td><span class="row">${call(a)}${acts(a)}</span></td></tr>`).join('')||'<tr><td colspan="9" class="mu">Nada encontrado.</td></tr>'}</table></div>`}
function vMarca(){return`<div class="card" style="max-width:460px"><label>Nome da barbearia</label><input id="m1" value="${esc(BARB.nome)}"><label>Slogan</label><input id="m2" value="${esc(BARB.slogan)}"><label>WhatsApp (com DDD)</label><input id="m3" value="${esc(BARB.whats)}"><label>Endereço</label><input id="m4" value="${esc(BARB.end)}"><label>Cor principal</label><input id="m5" type="color" value="${BARB.cor}" style="height:44px;padding:4px"><button class="btn" style="margin-top:14px" onclick="saveMarca()">Salvar marca</button></div>`}
function saveMarca(){const v=$('m1').value.trim();if(!v)return;S.brand={nome:v.slice(0,40),slogan:$('m2').value.trim().slice(0,60),whats:dg($('m3').value),end:$('m4').value.trim().slice(0,100),cor:/^#[0-9a-f]{6}$/i.test($('m5').value)?$('m5').value:'#fbbf24'};Object.assign(BARB,S.brand);save();toast('Marca salva');render()}
function vHor(){return`<h2>Configurações</h2><h3>Marca da barbearia</h3>${vMarca()}<h3 style="margin-top:22px">Horário de funcionamento</h3><div class="card" style="max-width:360px"><label>Abre</label><input id="h1" type="time" value="${S.horario.abre}"><label>Fecha</label><input id="h2" type="time" value="${S.horario.fecha}">${err?`<div class="err">${err}</div>`:''}<button class="btn" style="margin-top:14px" onclick="saveHor()">Salvar</button></div>`}
function saveHor(){const a=$('h1').value,f=$('h2').value;if(!a||!f||tm(f)<=tm(a)){err='Horário inválido.';return render()}S.horario={abre:a,fecha:f};err='';save();render()}
let tmpFoto=null;
function loadFoto(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),q=Math.min(im.width,im.height);x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,160,160);tmpFoto=c.toDataURL('image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)}
function pic(id){const b=nm(S.barbeiros,id);return b&&b.foto?`<img alt="" src="${b.foto}">`:face(id)}
function saveBarb(){const n=$('f1').value.trim(),cm=Math.max(0,Math.min(100,parseInt($('f3').value,10)||0));if(!n)return;const at=$('f2').checked;if(modal.id){const b=nm(S.barbeiros,modal.id);b.nome=n;b.ativo=at;b.comissao=cm;if(tmpFoto)b.foto=tmpFoto}else S.barbeiros.push({id:nid(S.barbeiros),nome:n,ativo:at,comissao:cm,foto:tmpFoto||undefined});tmpFoto=null;save();closeM()}
function saveServ(){const n=$('f1').value.trim(),p=+$('f2').value,d=+$('f3').value;if(!n||!(p>0)||!(d>0))return;if(modal.id)Object.assign(nm(S.servicos,modal.id),{nome:n,preco:p,dur:d});else S.servicos.push({id:nid(S.servicos),nome:n,preco:p,dur:d});save();closeM()}
function vModal(){const m=modal;if(m.t=='ag'){const a=nm(S.agendamentos,m.id);return`<h3>${esc(a.clienteNome)}</h3><p class="mu">${fd(a.data)} · ${a.hora} · ${esc(nm(S.servicos,a.servicoId)?.nome||'')} · ${bn(a.barberId)}<br>${esc(a.clienteTel||'')} ${tag(a.status)}</p><div class="row">${call(a)}${acts(a)}${a.status=='agendado'?cancelBtn(a):''}</div><div style="margin-top:12px"><button class="btn s" onclick="closeM()">Fechar</button></div>`}
if(m.t=='bal')return`<h3>Agendar no balcão</h3><p class="mu">${fd(m.d)} · ${m.h} · ${bn(m.b)}</p><label>Cliente</label><select id="bc" onchange="$('bn').style.display=this.value?'none':''"><option value="">Novo cliente...</option>${S.users.filter(u=>u.role=='cliente').map(u=>`<option value="${u.id}">${esc(u.nome)}</option>`).join('')}</select><div id="bn"><label>Nome completo</label><input id="bn1"><label>Telefone</label><input id="bn2" inputmode="tel" oninput="mask(this)"></div><label>Serviço</label><select id="bs">${S.servicos.map(x=>`<option value="${x.id}">${esc(x.nome)} · ${brl(x.preco)}</option>`).join('')}</select>${err?`<div class="err">${err}</div>`:''}<div class="row" style="margin-top:14px"><button class="btn" onclick="saveBal()">Agendar</button><button class="btn s" onclick="err='';closeM()">Cancelar</button></div>`;if(m.t=='pg')return`<h3>Forma de pagamento</h3><p class="mu">Como o cliente pagou?</p><div class="seg">${Object.keys(FL).map(k=>`<button onclick="mark(${m.id},'concluido','${k}')">${FL[k]}</button>`).join('')}</div><button class="btn s" onclick="closeM()">Voltar</button>`;if(m.t=='conf')return`<h3>Confirmação</h3><p>${esc(m.msg)}</p><div class="row"><button class="btn" onclick="modal.fn()">Confirmar</button><button class="btn s" onclick="closeM()">Voltar</button></div>`;
if(m.t=='barb'){const b=m.id?nm(S.barbeiros,m.id):{nome:'',ativo:true};return`<h3>${m.id?'Editar':'Novo'} barbeiro</h3><label>Nome</label><input id="f1" value="${esc(b.nome)}"><label>Foto</label><input id="f4" type="file" accept="image/*" onchange="loadFoto(this)"><label>Comissão (%)</label><input id="f3" type="number" min="0" max="100" value="${b.comissao??40}"><label><input id="f2" type="checkbox" style="width:auto" ${b.ativo?'checked':''}> Ativo</label><div class="row" style="margin-top:14px"><button class="btn" onclick="saveBarb()">Salvar</button><button class="btn s" onclick="closeM()">Cancelar</button></div>`}
const s=m.id?nm(S.servicos,m.id):{nome:'',preco:'',dur:''};return`<h3>${m.id?'Editar':'Novo'} serviço</h3><label>Nome</label><input id="f1" value="${esc(s.nome)}"><label>Preço (R$)</label><input id="f2" type="number" min="0" value="${s.preco}"><label>Duração (min)</label><input id="f3" type="number" min="5" step="5" value="${s.dur}"><div class="row" style="margin-top:14px"><button class="btn" onclick="saveServ()">Salvar</button><button class="btn s" onclick="closeM()">Cancelar</button></div>`}
const V={'c-agendar':vAgendar,'c-meus':vMeus,'b-agenda':vCal,'a-cal':vCal,'c-perfil':vPerfil,'b-bloq':vBloq,'a-dash':vDash,'a-barb':vBarb,'a-serv':vServ,'a-agend':vAgend,'a-hor':vHor,'a-fin':vFin,'a-cli':vCli,'b-cli':vCli,'b-com':vCom};
function render(){applyBrand();if(route[1]=='-'&&!(route=='c-agendar'&&!S.user)&&(!S.user||S.user.role!==need[route[0]]))route='login';
let h=route=='home'?vHome():route=='login'?vLogin():route=='registro'?vRegistro():route=='esqueci'?vEsqueci():route=='termos'||route=='privacidade'?vLegal():(S.user?shell:pubShell)(V[route]());
if(modal)h+=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="card">${vModal()}</div></div>`;$('app').innerHTML=h}
if(S.user)route=HOME[S.user.role];render();
</script></body></html>
